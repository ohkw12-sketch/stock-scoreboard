<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주식평가창</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#07120f;color:#edf7f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07120f,#0d1714);color:#edf7f2}.wrap{max-width:1700px;margin:0 auto;padding:18px}.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}h1{font-size:28px;margin:0}.muted{color:#9fb0a8;font-size:13px;max-width:920px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid #2b4038;background:#101f1a;color:#dce8e2;padding:10px 16px;border-radius:999px;cursor:pointer}.tab.active{background:#1f6f50;border-color:#2f966f}.panel{display:none}.panel.active{display:block}.card{background:rgba(17,31,26,.92);border:1px solid #263b34;border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.tablewrap{overflow:auto;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1420px}#p3 table{min-width:1900px}th,td{padding:10px 9px;border-bottom:1px solid #22352e;text-align:right;white-space:nowrap;font-size:13px}th{position:sticky;top:0;background:#13241e;color:#a9bbb2;z-index:1}th:first-child,td:first-child{text-align:left}tbody tr:hover{background:#10241c}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;border:1px solid #315346;background:#173126}.good{color:#8fe0ad}.warn{color:#ffd47f}.bad{color:#ff9c9c}.summary{margin:8px 0 14px;color:#c3d2ca;line-height:1.55}.rank{font-weight:700;color:#dce8e2}.reason{text-align:left;white-space:normal;min-width:320px}.basis{color:#aebdb6}
@media(max-width:780px){.wrap{padding:10px}h1{font-size:22px}.card{padding:8px}.tablewrap{overflow:visible}table,#p3 table{min-width:0}thead{display:none}tbody,tr,td{display:block;width:100%}tr{margin:0 0 12px;border:1px solid #294038;border-radius:12px;padding:7px;background:#0e1c17}td,th:first-child,td:first-child{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;text-align:left;white-space:normal;padding:7px 8px;border:0;font-size:12px}td::before{content:attr(data-label);color:#8fa49a;font-weight:600}.reason{min-width:0}.tabs{position:sticky;top:0;z-index:5;background:#07120f;padding:6px 0}.tab{flex:1;padding:9px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>주식평가창</h1><div id="updated" class="muted">불러오는 중...</div></div><div id="note" class="muted"></div></div>
  <div class="tabs"><button class="tab active" data-tab="p1">프로젝트1</button><button class="tab" data-tab="p2">프로젝트2</button><button class="tab" data-tab="p3">프로젝트3</button></div>
  <section id="p1" class="panel active"><div class="card"><div class="summary" id="p1status"></div><div class="tablewrap"><table><thead><tr><th>순위</th><th>종목</th><th>세부섹터</th><th>1년 OP성장</th><th>가치배수</th><th>섹터 중앙</th><th>할인/프리미엄</th><th>컨센서스 1M/3M</th><th>신뢰도</th><th>구분</th><th>핵심근거</th></tr></thead><tbody id="p1body"></tbody></table></div></div></section>
  <section id="p2" class="panel"><div class="card"><div class="summary" id="p2status"></div><div class="tablewrap"><table><thead><tr><th>순위</th><th>종목</th><th>세부섹터</th><th>26년 3Q 매출성장</th><th>26년 4Q 매출성장</th><th>2027E 매출성장</th><th>1년 OP성장</th><th>가치배수</th><th>섹터 중앙</th><th>할인/프리미엄</th><th>컨센서스 1M/3M</th><th>신뢰도</th><th>구분</th><th>핵심근거</th></tr></thead><tbody id="p2body"></tbody></table></div></div></section>
  <section id="p3" class="panel"><div class="card"><div class="summary" id="p3status"></div><div class="tablewrap"><table><thead><tr><th>종목</th><th>코드</th><th>세부섹터</th><th>기준가</th><th>평균매입가</th><th>평단대비</th><th>1년 OP성장</th><th>Fwd PER</th><th>섹터 중앙</th><th>할인/프리미엄</th><th>컨센서스 1M/3M</th><th>실현신뢰도</th><th>주가 1M</th><th>주가 3M</th><th>기업판정</th><th>가격판정</th><th>행동</th><th>기준일</th></tr></thead><tbody id="p3body"></tbody></table></div></div></section>
</div>
<script>
const fmt=v=>v==null?'—':new Intl.NumberFormat('ko-KR').format(v);
const val=v=>v==null?'—':v;
const cell=(label,value,cls='')=>`<td data-label="${label}" class="${cls}">${val(value)}</td>`;
function actionClass(a=''){if(a.includes('추매')||a.includes('최우선')||a.includes('후보'))return'good';if(a.includes('축소')||a.includes('매도'))return'bad';return'warn'}
function renderRanked(key,d){const body=document.getElementById(key+'body');body.innerHTML='';d[key].rows.forEach(x=>{const tr=document.createElement('tr');const sales=key==='p2'?cell('26년 3Q 매출성장',x.salesQ3)+cell('26년 4Q 매출성장',x.salesQ4)+cell('2027E 매출성장',x.sales27):'';tr.innerHTML=cell('순위',x.rank,'rank')+cell('종목',x.name)+cell('세부섹터',x.sector)+sales+cell('1년 OP성장',x.opGrowth)+cell('가치배수',x.value)+cell('섹터 중앙',x.sectorMedian)+cell('할인/프리미엄',x.premium)+cell('컨센서스 1M/3M',x.consensus)+cell('신뢰도',x.reliability)+cell('구분',`<span class="badge ${actionClass(x.signal)}">${x.signal}</span>`)+cell('핵심근거',x.reason,'reason');body.appendChild(tr)});}
async function load(){const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});const d=await r.json();document.getElementById('updated').textContent='업데이트 '+d.meta.updatedKST+' KST';document.getElementById('note').textContent=d.meta.note||'';['p1','p2','p3'].forEach(k=>document.getElementById(k+'status').textContent=d[k].status||'');renderRanked('p1',d);renderRanked('p2',d);const body=document.getElementById('p3body');body.innerHTML='';d.p3.rows.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=cell('종목',x.name)+cell('코드',x.code)+cell('세부섹터',x.sector)+cell('기준가',fmt(x.price))+cell('평균매입가',fmt(x.avg))+cell('평단대비',x.ret)+cell('1년 OP성장',x.opGrowth)+cell('Fwd PER',x.fwdPer)+cell('섹터 중앙',x.sectorMedian)+cell('할인/프리미엄',x.premium)+cell('컨센서스 1M/3M',x.consensus)+cell('실현신뢰도',x.reliability)+cell('주가 1M',x.m1)+cell('주가 3M',x.m3)+cell('기업판정',x.company)+cell('가격판정',x.priceView)+cell('행동',`<span class="badge ${actionClass(x.action)}">${x.action}</span>`)+cell('기준일',x.basis,'basis');body.appendChild(tr)});}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});load().catch(e=>{document.getElementById('updated').textContent='데이터 로드 실패';console.error(e)});
</script>
</body>
</html>
