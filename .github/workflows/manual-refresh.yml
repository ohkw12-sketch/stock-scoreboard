name: 주식평가 수동 실행

run-name: PC·모바일 실행 · ${{ inputs.slot || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '실행 단계 (auto는 현재 한국시간에 맞춤)'
        type: choice
        options: [auto, '08:00', '10:30', '15:00']
        default: auto

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/cloud-refresh.yml
    with:
      mode: refresh
      slot: ${{ inputs.slot || 'auto' }}
    secrets: inherit
