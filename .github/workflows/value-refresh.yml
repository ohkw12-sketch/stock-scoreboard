name: Refresh Whole Stock Scoreboard

# Manual full refresh; a code push must not start a second expensive run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-all:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify required credentials
        shell: bash
        run: |
          test -n "$DART_API_KEY" || { echo 'DART_API_KEY secret is missing'; exit 2; }
          test -n "$KIS_APP_KEY" || { echo 'KIS_APP_KEY secret is missing'; exit 2; }
          test -n "$KIS_APP_SECRET" || { echo 'KIS_APP_SECRET secret is missing'; exit 2; }
      - name: Run and validate all boards
        run: python refresh_all.py --config config.kis.example.json
      - name: Promote validated board files
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          report=json.loads(Path('test_output/collection_report.test.json').read_text('utf-8'))
          if report.get('qualityStatus') != '정상': raise SystemExit('price validation failed')
          shutil.copy2('test_output/data.test.json','data.json')
          if Path('test_output/youtube-market.test.json').exists():
              shutil.copy2('test_output/youtube-market.test.json','youtube-market.json')
          PY
      - name: Commit refreshed boards
        shell: bash
        run: |
          if git diff --quiet -- data.json youtube-market.json; then
            echo 'No board changes to commit.'
            exit 0
          fi
          git config user.name 'stock-scoreboard-bot'
          git config user.email 'stock-scoreboard-bot@users.noreply.github.com'
          git add data.json youtube-market.json
          git commit -m 'Refresh whole stock scoreboard'
          git push
