name: Refresh Whole Stock Scoreboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cloud migration: verify-state or full AI refresh'
        type: choice
        options: [verify-state, refresh]
        default: verify-state

permissions:
  contents: write

jobs:
  cloud:
    uses: ./.github/workflows/cloud-refresh.yml
    with:
      mode: ${{ inputs.mode }}
      slot: auto
    secrets: inherit